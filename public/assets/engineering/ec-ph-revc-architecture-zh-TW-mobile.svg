<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1600" viewBox="0 0 760 1600" role="img" aria-labelledby="title desc"><title id="title">AquaNode R0.3-EC-pH-revC</title><desc id="desc">revC 功能圖 · 不可用於電路板製造. 電源、真實校正與同一水樣測試仍待完成。電池供電 pH 尚未完成。</desc><defs><linearGradient id="sea" x2="1" y2="1"><stop stop-color="#0b303e"/><stop offset="1" stop-color="#174950"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#244e54" stop-opacity=".72"/><stop offset="1" stop-color="#0c3440" stop-opacity=".6"/></linearGradient><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 2l8 4-8 4" fill="none" stroke="#c8dca9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="760" height="1600" fill="url(#sea)"/><g fill="none" stroke="#bcd5bd" opacity=".05"><path d="M40 0V1600"/><path d="M140 0V1600"/><path d="M240 0V1600"/><path d="M340 0V1600"/><path d="M440 0V1600"/><path d="M540 0V1600"/><path d="M640 0V1600"/><path d="M740 0V1600"/></g><g font-family="Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif"><text x="40" y="52" font-size="20" fill="#bdd0b3" >AQUANODE / EC+pH-revC</text><text x="40" y="119" font-size="34" fill="#edf3e7" >revC 功能架構</text><text x="40" y="162" font-size="30" fill="#a9c6c3" >具隔離式 pH 路徑的淡水平台設計。</text><text x="40" y="215" font-size="21" fill="#c8dca9" >01 / 感測器輸入</text><g><rect x="40" y="240" width="680" height="210" rx="6" fill="url(#card)" stroke="#c8dca9" stroke-opacity=".7"/><text x="64" y="271" font-size="26" fill="#c8dca9" >隔離式 pH</text><text x="64" y="317" font-size="38" fill="#f0f5e9" font-weight="500">SEN0169-V2</text><text x="64" y="356" font-size="32" fill="#b8cfca" >DFR0504 · 電源與訊號隔離</text><text x="64" y="394" font-size="32" fill="#b8cfca" >獨立 5 V 穩壓平台電源</text></g><path d="M380 450v43" fill="none" stroke="#c8dca9" stroke-width="1.8" marker-end="url(#arrow)"/><g><rect x="40" y="500" width="680" height="160" rx="6" f