="64" y="1381" font-size="32" fill="#b8cfca" >規劃中的 USB 擷取</text></g><path d="M40 1460h680" stroke="#a8c0aa" stroke-opacity=".3"/><text x="40" y="1498" font-size="24" fill="#dce8c9" >硬體驗證尚待完成。</text><text x="40" y="1530" font-size="24" fill="#adc9c4" >pH 需要獨立平台電源。</text><text x="40" y="1562" font-size="24" fill="#adc9c4" >未提供實測準確度或實地讀值。</text><text x="40" y="1580" font-size="18" fill="#91b1aa" >AquaNode · CC BY 4.0 · 02.11.2026</text></g></svg>